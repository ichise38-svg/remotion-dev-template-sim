name: Render video

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Japanese fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk fonts-ipafont-gothic

      - name: Install Chrome Headless Shell (for Remotion rendering)
        run: npx remotion browser ensure

      - name: Render video
        run: npx remotion render TsuushinReview out/tsuushin-review.mp4

      - name: Upload mp4 as artifact
        uses: actions/upload-artifact@v4
        with:
          name: tsuushin-review-mp4
          path: out/tsuushin-review.mp4
          retention-days: 30
